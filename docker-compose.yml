services:
  gateway:
    build: .
    ports:
      - "3002:3002"
    env_file:
      - .env
    command: uvicorn gateway.x402_gateway:app --host 0.0.0.0 --port 3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/')"]
      interval: 30s
      timeout: 5s
      retries: 3
