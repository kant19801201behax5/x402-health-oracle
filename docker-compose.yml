services:
  gateway:
    build: .
    ports:
      - "3002:3002"
    env_file:
      - .env
    command: uvicorn gateway.x402_gateway:app --host 0.0.0.0 --port 3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  probe:
    build: .
    env_file:
      - .env
    command: python probe/multi_chain_probe.py
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

  distributor:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    command: python probe/wss_distributor.py
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
