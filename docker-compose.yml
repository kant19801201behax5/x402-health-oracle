services:
  gateway:
    build: .
    ports:
      - "3002:3002"
    env_file:
      - .env
    command: uvicorn gateway.x402_gateway:app --host 0.0.0.0 --port 3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  probe:
    build: .
    ports:
      - "8765:8765"
      - "8766:8766"
    environment:
      - FEED_LOG_PATH=/opt/phoenix_zero/data/feed.jsonl
      - PHOENIX_EBPF_ENABLED=false
    command: python -u /app/probe/wss_distributor.py
    restart: unless-stopped
    volumes:
      - probe-data:/opt/phoenix_zero/data

volumes:
  probe-data:
